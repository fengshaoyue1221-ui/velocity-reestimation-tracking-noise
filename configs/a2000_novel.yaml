# No-velocity ablation: clean training, observed velocities zeroed (train and eval).
# RTX A2000 edition (3x RTX A2000 12GB): train on all downloaded training shards
# (~50 of 1000 = ~5% of WOMD) and evaluate on all downloaded validation shards (~50 of 150).
# Model, optimizer and 30-epoch schedule identical to official MTR; only data scale and batch differ.
# Role: clean-trained model (noise only at evaluation); also used to EVALUATE both models.
DATA_CONFIG:
    DATASET: WaymoDataset
    DROP_VELOCITY_INPUT: True
    OBJECT_TYPE: &object_type ['TYPE_VEHICLE', 'TYPE_PEDESTRIAN', 'TYPE_CYCLIST']
    
    DATA_ROOT: 'data/waymo'
    SPLIT_DIR: {
        'train': 'processed_scenarios_training', 
        'test': 'processed_scenarios_validation'
    }

    INFO_FILE: {
        'train': 'processed_scenarios_training_infos.pkl', 
        'test': 'processed_scenarios_val_infos.pkl'
    }

    SAMPLE_INTERVAL: {
        'train': 1, 
        'test': 1
    }

    INFO_FILTER_DICT: 
        filter_info_by_object_type: *object_type

    # ---- perception noise for robustness experiments ----
    PERCEPTION_NOISE:
        APPLY_TRAIN: False
        APPLY_TEST: True
        LEVEL: 1.0            # global strength, sweep 0 / 0.5 / 1 / 2 / 3
        SEED: 0
        POS_STD: 0.15         # m
        POS_RANGE_COEF: 0.005 # extra m per m of distance to SDC
        POS_RHO: 0.8
        HEAD_STD: 0.05        # rad
        VEL_STD: 0.2          # m/s
        SIZE_STD: 0.05
        DROP_PROB: 0.05
        TRUNC_PROB: 0.1
        IDSWAP_PROB: 0.05
        IDSWAP_DIST: 3.0
        KEEP_SDC_CLEAN: True
        DT: 0.1
        TRAIN_CLEAN_PROB: 0.0
        VEL_SMOOTH_K: 0
        VEL_FROM_POS: True
        POS_FOR_VEL_ONLY: False
        CLASS_SCALE:           # per-class noise multiplier (defaults = paper setting)
            TYPE_VEHICLE: 1.0
            TYPE_PEDESTRIAN: 1.5
            TYPE_CYCLIST: 1.3

   # for map feature encoding
    POINT_SAMPLED_INTERVAL: 1
    NUM_POINTS_EACH_POLYLINE: 20
    VECTOR_BREAK_DIST_THRESH: 1.0

    NUM_OF_SRC_POLYLINES: 768
    CENTER_OFFSET_OF_MAP: &center_offset [30.0, 0]


MODEL:
    CONTEXT_ENCODER:
        NAME: MTREncoder

        NUM_OF_ATTN_NEIGHBORS: 16
        NUM_INPUT_ATTR_AGENT: 29
        NUM_INPUT_ATTR_MAP: 9
        
        NUM_CHANNEL_IN_MLP_AGENT: 256
        NUM_CHANNEL_IN_MLP_MAP: 64
        NUM_LAYER_IN_MLP_AGENT: 3
        NUM_LAYER_IN_MLP_MAP: 5
        NUM_LAYER_IN_PRE_MLP_MAP: 3

        D_MODEL: 256
        NUM_ATTN_LAYERS: 6
        NUM_ATTN_HEAD: 8 
        DROPOUT_OF_ATTN: 0.1 

        USE_LOCAL_ATTN: True

    MOTION_DECODER:
        NAME: MTRDecoder

        OBJECT_TYPE: *object_type 
        CENTER_OFFSET_OF_MAP: *center_offset

        NUM_FUTURE_FRAMES: 80
        NUM_MOTION_MODES: 6

        INTENTION_POINTS_FILE: data/waymo/cluster_64_center_dict.pkl

        D_MODEL: 512
        NUM_DECODER_LAYERS: 6 
        NUM_ATTN_HEAD: 8
        MAP_D_MODEL: 256
        DROPOUT_OF_ATTN: 0.1 

        NUM_BASE_MAP_POLYLINES: 256
        NUM_WAYPOINT_MAP_POLYLINES: 128

        LOSS_WEIGHTS: {
            'cls': 1.0, 
            'reg': 1.0, 
            'vel': 0.5
        }

        NMS_DIST_THRESH: 2.5


OPTIMIZATION:
    BATCH_SIZE_PER_GPU: 4   # 12GB RTX A2000; total batch set on command line (3 GPUs x 4 = 12)
    NUM_EPOCHS: 30

    OPTIMIZER: AdamW
    LR: 0.0001
    WEIGHT_DECAY: 0.01

    SCHEDULER: lambdaLR
    DECAY_STEP_LIST: [22, 24, 26, 28]
    LR_DECAY: 0.5
    LR_CLIP: 0.000001

    GRAD_NORM_CLIP: 1000.0
